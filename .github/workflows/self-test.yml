name: self-test

# The harness's own gate: every assertion kind has a clean fixture family
# that passes and a planted-drift family that fails on exactly the checks
# the plant targets. Runs on every pull request and push to main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    name: harness self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Data files parse and every check names a known kind and home
        run: python3 harness/spec_drift.py --help > /dev/null && python3 harness/tests/run_tests.py
